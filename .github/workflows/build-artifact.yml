name: Build APK

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build vanilla debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-37

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew assembleVanillaDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/vanilla/debug/app-vanilla-debug.apk \
            "artifacts/aurora-store-vanilla-debug-${GITHUB_SHA::7}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-store-vanilla-debug-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
